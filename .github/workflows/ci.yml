name: Scala CI

on:
  pull_request: {}
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🚀 Start Valkey
        run: docker compose up -d

      - name: 📦 Cache sbt & coursier
        uses: coursier/cache-action@v6

      - name: ❄️ Install Nix
        uses: cachix/install-nix-action@v31.2.0

      - name: 🧪 Run tests
        run: nix run .#sbt -- testAll

      - name: 🔍 Check for untracked changes
        run: |
          git status
          ./scripts/check_dirty.sh

      - name: 🧹 Stop Valkey
        if: always()
        run: docker compose down

  benchmark:
    name: 📊 Benchmark
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚀 Start Valkey
        run: docker compose up -d

      - name: 📦 Cache sbt & coursier
        uses: coursier/cache-action@v6

      - name: ❄️ Install Nix
        uses: cachix/install-nix-action@v31.2.0

      - name: 📊 Run benchmarks
        run: |
          nix run .#sbt -- "benchmarks/Jmh/run -i 5 -wi 3 -f 1 -t 1 -rff results.json -rf json .*CommandBenchmark"

      - name: 📋 Print results
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Command Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          data = json.load(open('results.json'))
          print(f"{'Benchmark':<40} {'Mode':<6} {'Score':>10} {'Error':>10} {'Units'}")
          print('-' * 80)
          for b in data:
              name = b['benchmark'].split('.')[-1]
              mode = b['mode']
              score = f"{b['primaryMetric']['score']:.3f}"
              err = b['primaryMetric'].get('scoreError')
              error = f"± {err:.3f}" if err is not None else ''
              unit = b['primaryMetric']['scoreUnit']
              print(f"{name:<40} {mode:<6} {score:>10} {error:>10} {unit}")
          PY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Codec Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          nix run .#sbt -- "benchmarks/Jmh/run -i 5 -wi 3 -f 0 -t 1 .*CodecBenchmark" 2>&1 | grep -E "(Benchmark|CodecBenchmark)" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload results
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: results.json

      - name: 🧹 Stop Valkey
        if: always()
        run: docker compose down

  release:
    name: 🚀 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: ❄️ Install Nix
        uses: cachix/install-nix-action@v31.2.0

      - name: 🔑 Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.PGP_SECRET }}
          passphrase: ${{ secrets.PGP_PASSPHRASE }}

      - name: 📦 Publish
        run: nix run .#sbt -- ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
